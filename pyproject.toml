[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tariff-exchange-rates"
version = "0.2.0"
description = "Code and data for 'Understanding Multilateral Tariffs and Exchange Rates'"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

# The production code under code/ is run as scripts (python code/run_all.py)
# and is not an installable package; this file only declares dependencies.
[tool.setuptools]
packages = []
